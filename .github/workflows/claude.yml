name: jiannius claude

# Reusable Claude for Jiannius repos: an automatic review of every pull request
# when it opens, and `@claude` replies to comments on pull requests and issues.
#
#   name: claude
#
#   on:
#     pull_request:
#       types: [opened, ready_for_review, reopened]
#     issue_comment:
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#
#   permissions:
#     contents: write
#     pull-requests: write
#     issues: write
#     id-token: write
#     actions: read
#
#   jobs:
#     claude:
#       uses: jiannius/playbook/.github/workflows/claude.yml@v0
#       secrets: inherit
#
# The caller must grant the `permissions:` above. A reusable workflow can only
# narrow what its caller gives it, never widen it, so a caller that grants less
# gets a run that fails on its first write.
#
# ---------------------------------------------------------------------------
# COST. GitHub-hosted runners, one job. The model time is not billed here at
# all: it rides a subscription token (see WHOSE SEAT). What we pay GitHub for
# is runner minutes, and the design keeps them to the events that need one:
#
#   1. The job-level `if:` below filters events BEFORE a runner starts, so a
#      comment that does not mention the trigger phrase, a draft pull request,
#      or a review switched off with `review-on-open: false` bills nothing.
#   2. One job, not two. Jobs are billed rounded UP to a whole minute, so the
#      token gate is a step, not a job — the same rule as laravel-ci.yml.
#   3. `concurrency` cancels a superseded run rather than letting it finish a
#      review nobody will read.
#   4. `timeout-minutes` bounds a run that hangs or loops. It has to be set
#      here: GitHub rejects `timeout-minutes` on the caller's job, the one with
#      `uses:`. `max-turns` bounds the conversation for the same reason, from
#      the model's side.
#
# Public repos are unmetered, which is why playbook runs this on itself first.
# ---------------------------------------------------------------------------
# THE TOKEN GATE. `CLAUDE_CODE_OAUTH_TOKEN` is optional on purpose. When it is
# missing — the repo is not switched on yet, or the run is a pull request from a
# fork, where GitHub withholds secrets — the job logs a notice, skips every
# action step and ends GREEN. So this can ship and be called from a repo before
# anyone owns a token, and switches on the moment the secret is added. A red X
# on every pull request in a repo that has not opted in would teach people to
# ignore red.
#
# The gate is a STEP, not a job-level `if:`. The `secrets` context is not
# available in a job-level `if:`, so the only place to test a secret is inside
# a step, by mapping it to `env:`. That is also why the job-level `if:` uses
# `github.event` and `inputs` only.
#
# This is the first `secrets:` declaration in any playbook workflow. The other
# workflows need none: they run on `secrets: inherit` without naming anything.
# Here the name matters, because `required: false` is what lets a caller omit it.
# ---------------------------------------------------------------------------
# WHOSE SEAT. The token is a Claude subscription seat, and Anthropic's rules
# tie a seat to one person. So the secret is generated by ONE named owner, with
# `claude setup-token`, and added as an org secret limited to the repos they
# chose. Never a token pasted into a shared place with no owner, and never one
# person's token quietly serving a repo they have not agreed to cover. The
# action itself requires write access from whoever triggers it and ignores bots,
# so a stranger cannot spend the owner's seat by commenting on a public repo.
#
# `github_token` is deliberately not passed. The action then acts as the Claude
# GitHub App, and commits it pushes trigger CI like any other push — the built-in
# token's commits do not. The App has to be installed by an org owner.
# ---------------------------------------------------------------------------
# TRIGGERS. Two modes, decided by the event:
#
#   REVIEW. A pull request opened, reopened, or marked ready. Runs Anthropic's
#   own `code-review` plugin rather than a prompt of ours. Jiannius-specific
#   rules reach it the way they reach every agent: through the repo's
#   CLAUDE.md / AGENTS.md, which the action reads and playbook already fills.
#   One reviewer, not two prompts drifting apart.
#
#   INTERACTIVE. A comment that contains the trigger phrase. No `prompt:` is
#   passed, and that is what puts the action in its reply-to-a-mention mode.
#   Comment events always run from the DEFAULT branch, so `@claude` replies only
#   work once the caller file has been merged there; review-on-open runs from
#   the pull request's own branch and works before that.
#
# Two separate action steps, each with its own `if:`, because the action picks
# its mode by whether `prompt` is present. Relying on an empty string counting as
# "absent" would be a guess.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      model:
        description: Claude model both modes run on.
        type: string
        default: claude-sonnet-5-5
      max-turns:
        description: >-
          Cap on agent turns per run. A safety net against a loop billing
          runner minutes, not a quality knob — set it well above a normal run.
        type: number
        default: 30
      timeout-minutes:
        description: >-
          Kill the job after this many minutes. Lives here, not on the caller's
          job, because GitHub rejects `timeout-minutes` on a job that uses
          `uses:`. See COST in this file's header.
        type: number
        default: 20
      review-on-open:
        description: >-
          Review every pull request when it is opened, reopened or marked ready
          (drafts are skipped). Set false to keep only `@claude` replies.
        type: boolean
        default: true
      trigger-phrase:
        description: The text in a comment that summons Claude.
        type: string
        default: '@claude'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: >-
          A subscription token from `claude setup-token`, run by the one person
          whose seat it is. Optional: without it the job skips and ends green.
          See THE TOKEN GATE and WHOSE SEAT in this file's header.
        required: false

# A newer event on the same pull request or issue cancels the older run.
# Without this, a review of a commit that has already been superseded keeps
# running, and billing, to produce comments nobody will read.
concurrency:
  group: jiannius-claude-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude:
    # Filters events before a runner starts, so an ignored event bills nothing.
    # Only `github.event` and `inputs` may appear here — `secrets` is not
    # available in a job-level `if:`, which is why the token gate is a step.
    if: >-
      (
        github.event_name == 'pull_request'
        && contains(fromJSON('["opened","ready_for_review","reopened"]'), github.event.action)
        && github.event.pull_request.draft == false
        && inputs.review-on-open
      )
      || (
        (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment')
        && contains(github.event.comment.body, inputs.trigger-phrase)
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # The caller has to grant the same, or the run fails on its first write.
    # See the caller snippet in this file's header.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      # Decided once, so every step below reads one output. This is a step and
      # not a job-level `if:` because `secrets` is not available there; mapping
      # the secret to `env:` is the only way to test whether it exists.
      #
      # An empty token is the expected state of a repo that has not been
      # switched on, so it is a notice and a green run, not an error.
      - name: Token gate
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, skipping. Add it as an org or repo secret to turn Claude on here. A pull request from a fork never sees it."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Depth 1: the action reads the diff through the GitHub API and only needs
      # the tree for CLAUDE.md / AGENTS.md. A full clone is minutes of runner
      # time for history nothing here reads.
      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Review mode: `prompt` is present, so the action runs it and exits.
      # Anthropic's own plugin does the reviewing, and the only tool allowed on
      # top of it is the inline-comment one it posts through — nothing here can
      # push or edit code.
      - name: Review the pull request
        if: steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

      # Interactive mode: no `prompt`, so the action waits on the trigger phrase
      # in the comment and answers it. The job-level `if:` already let only a
      # matching comment through; `trigger_phrase` is passed too so the action
      # agrees with it about what counts as a mention.
      - name: Reply to a mention
        if: steps.gate.outputs.enabled == 'true' && github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: ${{ inputs.trigger-phrase }}
          claude_args: >-
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max-turns }}
