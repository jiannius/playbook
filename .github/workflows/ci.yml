name: ci

# playbook's own CI, calling the reusable package workflow this repo ships.
# Dogfooding on purpose: if package-ci.yml breaks, it breaks here first.
#
# paths-ignore keeps pure documentation edits off the runner. Most commits to
# this repo are docs, and a whole billed minute to lint a markdown file we never
# lint is the easiest saving available.
#
# Deliberately NOT ignored: resources/boost/**. A guideline or skill change is
# exactly what the suite asserts on — tests/Feature/CheckCommandTest.php checks
# the rendered text really contains our rules — so those must still run.

on:
  # Lets us re-run CI without inventing a commit — useful when proving a
  # workflow change, and free on a public repo.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - LICENSE
      - .gitattributes
  pull_request:
    paths-ignore:
      - 'docs/**'
      - README.md
      - LICENSE
      - .gitattributes

jobs:
  ci:
    uses: ./.github/workflows/package-ci.yml
    # Both ends of the declared range, not just the newest. composer.json says
    # laravel/boost ^2.3 and this package is what pins Boost for the whole
    # fleet, so the floor is a promise to every repo that installs it — and an
    # untested floor is a guess. The extra leg is another billed minute, which
    # is free here: this repo is public, and public minutes are unmetered.
    with:
      dependency-versions: '["lowest","highest"]'
