name: jiannius laravel ci

# Reusable CI for Jiannius Laravel applications.
#
#   jobs:
#     ci:
#       uses: jiannius/playbook/.github/workflows/laravel-ci.yml@v0
#       secrets: inherit
#
# ---------------------------------------------------------------------------
# COST. We run private repos on GitHub's free allowance and pay nothing, so
# this workflow is written to fit inside it. Three rules drive the design:
#
#   1. Every JOB is billed rounded UP to a whole minute. A 5-second job costs
#      the same as a 59-second one. So this file has exactly ONE job — the
#      branch guard is a step, not a job, because as a job it cost a full
#      minute to compare two strings.
#   2. Private minutes are metered; public repos are unmetered. If a repo can
#      be public, it costs nothing at all.
#   3. Superseded runs keep billing unless cancelled. Hence `concurrency`.
#   4. A hung run bills until it is killed, and GitHub's default is 360
#      minutes. Hence `timeout-minutes`. It has to be set here: GitHub rejects
#      `timeout-minutes` on the caller's job, the one with `uses:`.
#
# Before adding a job here, check it is worth a whole minute of the monthly
# allowance on every repo that calls this.
#
# LEAN PULL REQUESTS. Pull requests are pushed to far more often than they
# merge, so on one measured repo they were 68% of all CI minutes. With
# `full-suite-on-pr: false`, a pull_request run does only the secret scan and
# the dependency audit. Neither needs `composer install`, npm or the database,
# so the run finishes in well under a minute. Everything else — style,
# migrations, tests, playbook:check — is skipped, and runs on push instead.
# That only holds if the caller also triggers on `push` to its integration
# branch. Without it, merged code is never tested until it reaches main.
# ---------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      php-version:
        description: PHP version to run against.
        type: string
        default: '8.4'
      node-version:
        description: Node version. Ignored when build-assets is false.
        type: string
        default: '22'
      base-branch:
        description: The integration branch pull requests must target.
        type: string
        default: dev
      database:
        description: >-
          Which driver CI runs against — mysql (default) or sqlite.
          Our apps are MySQL in production, so MySQL is the honest default:
          a suite that only ever passes on sqlite proves less than it looks.
        type: string
        default: mysql
      mysql-version:
        description: Docker tag for the MySQL service.
        type: string
        default: '8.0'
      build-assets:
        description: >-
          Run npm ci and npm run build. Set false for an app with no front-end
          build — it is the most expensive part of this workflow.
        type: boolean
        default: true
      browser-tests:
        description: >-
          Download the Chromium binary so Pest's browser tests can run. Off by
          default: it is a slow download, and a repo with no tests/Browser gains
          nothing from it. Turn it on for any app that has them — without it
          Pest throws PlaywrightNotInstalledException and the suite fails.
          Requires `playwright` in the project's package.json devDependencies;
          npm ci is run for you even when build-assets is false.
        type: boolean
        default: false
      check-schema:
        description: Run migrate:fresh --seed to prove the combined migration set applies.
        type: boolean
        default: true
      check-playbook:
        description: Run playbook:check. Set false for repos not yet onboarded to jiannius/playbook.
        type: boolean
        default: true
      check-secrets:
        description: >-
          Scan the working tree for committed secrets with gitleaks. A hit means
          rotate the credential — silencing the check is not the fix. Off only
          while a repo is mid-remediation.
        type: boolean
        default: true
      check-audit:
        description: >-
          Fail on a HIGH or CRITICAL composer advisory. Lower severities are
          printed and do not block, because a medium published overnight should
          not turn every open PR in the fleet red. Set false while a repo is
          mid-remediation — and say when it goes back on.
        type: boolean
        default: true
      full-suite-on-pr:
        description: >-
          Run the whole suite on pull_request events. Set false to run only the
          secret scan and dependency audit on PRs — see LEAN PULL REQUESTS in
          this file's header, including the `push` trigger it requires.
        type: boolean
        default: true
      timeout-minutes:
        description: >-
          Kill the job after this many minutes. A safety net against a hung
          step billing for hours, not a performance target — set it well above
          a normal run.
        type: number
        default: 30

# A second push to the same branch cancels the first. Without this, an
# abandoned run keeps consuming the allowance to produce a result nobody reads.
concurrency:
  group: jiannius-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}

    # Defined unconditionally — Actions cannot attach a service behind an `if:`.
    # A sqlite project pays a few seconds for a container it never connects to,
    # which is still cheaper than a second job.
    services:
      mysql:
        image: mysql:${{ inputs.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # A step, not a job. As a job this cost a whole billed minute to compare
      # two strings; as a step it is free and fails just as fast.
      #
      # `github.base_ref` comes from the event payload, NOT from live PR state,
      # and retargeting a PR fires `pull_request: edited` — not one of the
      # default trigger types. So changing the base produces no new run, and the
      # run already on the PR keeps reporting the base it was created with. A
      # correctly-targeted PR can therefore sit under a red guard indefinitely.
      #
      # Re-running does NOT clear it: a re-run replays the original payload, so
      # the guard reads the same stale base again. It takes a fresh event —
      # push a commit (`synchronize`), or `gh pr close N && gh pr reopen N`
      # (`reopened`). Confirm the fix by checking this step reports `skipped`.
      - name: Pull request must target ${{ inputs.base-branch }}
        if: github.event_name == 'pull_request' && github.base_ref != inputs.base-branch
        run: |
          echo "::error::This PR targets '${{ github.base_ref }}' but the integration branch is '${{ inputs.base-branch }}'."
          echo "Retarget the pull request, then re-trigger with a fresh event:"
          echo "  push a commit, or close and reopen the PR."
          echo "Re-running this workflow will NOT help - it replays the original payload."
          exit 1

      # Decided once, so every gated step below reads one output instead of
      # repeating the event/input expression.
      - name: Scope
        id: scope
        env:
          LEAN: ${{ github.event_name == 'pull_request' && !inputs.full-suite-on-pr }}
        run: |
          if [ "$LEAN" = "true" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lean pull request run: secret scan and dependency audit only. The full suite runs on push."
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v7

      # First, unlike the advisory gate at the end of this file, and deliberately.
      # A live credential in the repo is the most important fact about the run, and
      # nothing later is worth knowing until it is dealt with. Costs a few seconds
      # and needs no PHP.
      #
      # The binary, not gitleaks-action: the action requires a paid GITLEAKS_LICENSE
      # for organizations, and the CLI it wraps is Apache-2.0. We pay nothing for CI
      # and intend to keep it that way.
      - name: Secret scan
        if: inputs.check-secrets
        env:
          # Pinned, not latest: a scanner that moves under you turns an unrelated PR
          # red for a rule nobody in this repo added.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail

          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks

          # Scan what git TRACKS, not what happens to be sitting on disk. Pointing
          # gitleaks at the working directory reads vendor/, storage/logs, .env and
          # any local worktree: on the first host app that produced 195 findings,
          # every one of them in a file git never sees. Exporting the index gives the
          # same answer in CI and on a laptop, whatever else is lying around — and it
          # scans a secret that is actually committed, which is the one a clone gets.
          # checkout-index exports the INDEX. After a fresh checkout that is exactly
          # HEAD, which is the tree a clone gets. Run by hand on a dirty laptop it
          # scans what is staged, not what is merely saved — worth knowing before
          # concluding the check missed something.
          scan="$(mktemp -d)"
          git checkout-index -a --prefix="${scan}/"

          # Agent-managed skill directories arrive from composer packages via
          # boost:update; nobody hand-writes them. Boost's own laravel-best-practices
          # skill carries a "committed to the repo" example — STRIPE_SECRET=sk_live_abc123
          # — which trips generic-api-key, so scanning these would fail every repo in
          # the fleet over upstream's illustration of the very rule we are enforcing.
          rm -rf "${scan}/.claude/skills" "${scan}/.agents/skills" \
                 "${scan}/.github/skills" "${scan}/.cursor/skills" \
                 "${scan}/.junie/skills" "${scan}/.kiro/skills"

          # A repo tunes the rest with its own .gitleaks.toml (rules) or .gitleaksignore
          # (individual findings). Both are tracked, so both land in the export and
          # gitleaks reads them from there.
          #
          # --redact is not optional: without it a finding prints the credential into
          # a CI log that far more people can read than the file it came from.
          /tmp/gitleaks dir "${scan}" --no-banner --redact --exit-code 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer:v2
          extensions: pdo_mysql
          coverage: none

      # Every step from here to the dependency audit is skipped on a lean run.
      - name: Composer cache location
        id: composer-cache
        if: steps.scope.outputs.full == 'true'
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

      # Browser tests need node too, even in a repo that builds no assets —
      # the playwright CLI comes from the project's own devDependencies.
      - name: Setup Node
        if: steps.scope.outputs.full == 'true' && (inputs.build-assets || inputs.browser-tests)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install PHP dependencies
        if: steps.scope.outputs.full == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environment
        if: steps.scope.outputs.full == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate

      # Laravel loads .env non-destructively — it never overwrites a variable
      # already in the real environment (Illuminate\Support\Env builds an
      # immutable repository). So exporting these beats .env.example without
      # editing the file.
      - name: Point Laravel at MySQL
        if: steps.scope.outputs.full == 'true' && inputs.database == 'mysql'
        run: |
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=root"
            echo "DB_PASSWORD=root"
          } >> "$GITHUB_ENV"

      - name: Install Node dependencies
        if: steps.scope.outputs.full == 'true' && (inputs.build-assets || inputs.browser-tests)
        run: npm ci

      - name: Build assets
        if: steps.scope.outputs.full == 'true' && inputs.build-assets
        run: npm run build

      # Only chromium. --with-deps pulls the system libraries the runner lacks.
      # Downloading all three engines would roughly triple this step for browsers
      # we never drive.
      - name: Install Playwright browser
        if: steps.scope.outputs.full == 'true' && inputs.browser-tests
        run: npx playwright install --with-deps chromium

      - name: Code style
        if: steps.scope.outputs.full == 'true'
        run: vendor/bin/pint --test

      # Two parallel branches each run only their OWN migrations against their
      # OWN database, so the combined set is untested until both land — and
      # migrate:fresh replays in filename timestamp order, which need not match
      # merge order. CI always starts empty, so it tests the real sequence every
      # time and nobody has to remember to.
      - name: Migrations apply from empty
        if: steps.scope.outputs.full == 'true' && inputs.check-schema
        run: php artisan migrate:fresh --seed --no-interaction

      - name: Tests
        if: steps.scope.outputs.full == 'true'
        run: vendor/bin/pest

      # Boost has no verify mode. This is the gate that makes the standard stick.
      # Exit 1 = stale, run boost:update and commit. Exit 2 = misconfigured.
      - name: Guidelines are current
        if: steps.scope.outputs.full == 'true' && inputs.check-playbook
        run: php artisan playbook:check

      # Last on purpose. An advisory is rarely the fault of the PR being tested,
      # so it must not be the failure that hides a broken suite — by the time
      # this runs, the interesting result is already known.
      #
      # `--locked` audits composer.lock rather than the installed tree, so it
      # reports what this repo actually ships — and needs no `composer install`,
      # which is why it still runs on a lean pull request. Only high and critical block:
      # every level would make a fleet-wide gate that fires on someone else's
      # release schedule, and a gate people learn to ignore enforces nothing.
      - name: Dependency advisories
        if: inputs.check-audit
        run: |
          set -uo pipefail

          # audit exits non-zero whenever it finds anything at all; severity is
          # decided below, so its own status is not the answer here.
          composer audit --locked --format=json > audit.json || true

          cat > audit-gate.php <<'PHP'
          <?php

          $data = json_decode(file_get_contents('audit.json'), true) ?: [];
          $blocking = [];
          $lesser = 0;

          foreach ($data['advisories'] ?? [] as $package => $items) {
              foreach ($items as $item) {
                  $severity = strtolower($item['severity'] ?? 'unknown');
                  $line = sprintf(
                      '%s %s — %s (%s)',
                      $package,
                      strtoupper($severity),
                      $item['title'] ?? 'advisory',
                      $item['cve'] ?? ($item['advisoryId'] ?? 'no id')
                  );

                  in_array($severity, ['high', 'critical'], true)
                      ? $blocking[] = $line
                      : $lesser++;
              }
          }

          if ($lesser > 0) {
              printf("%d advisory(ies) below high severity. Not blocking, still worth clearing.\n", $lesser);
          }

          if ($blocking === []) {
              print("No high or critical advisories.\n");
              exit(0);
          }

          foreach ($blocking as $line) {
              printf("::error::%s\n", $line);
          }

          print("\nRun `composer audit` locally for the full report, then `composer update <package>`.\n");
          print("If the fix cannot land now, set `check-audit: false` on this workflow and open an issue for it.\n");
          exit(1);
          PHP

          php audit-gate.php
