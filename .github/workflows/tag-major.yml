name: move major tag

# Consumers pin reusable workflows with a major tag such as `@v0`, but composer resolves semver.
# That means every release needs two tags, and the moving one is exactly the
# kind of step a person forgets. So it is not a rule — it is this file.
#
# Push v1.4.2 and the v1 tag follows it here.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Point the major tag at this release
        run: |
          set -euo pipefail
          full="${GITHUB_REF_NAME}"
          major="${full%%.*}"          # v1.4.2 -> v1

          echo "Moving ${major} to ${full} (${GITHUB_SHA})"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push origin "refs/tags/${major}" --force
